name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  schema-drift:
    name: Schema drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Fail if schema.ts has ungenerated migrations
        # Regenerate from schema.ts — if the drizzle/ folder changes, someone forgot db:generate
        run: |
          bun run db:generate
          git diff --exit-code drizzle/
          if git ls-files --others --exclude-standard drizzle/ | grep -q .; then
            echo "Untracked migration files found — run 'bun run db:generate' and commit the result"
            exit 1
          fi

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  integration:
    name: Integration tests (includes migration smoke + constraint tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restock_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply migrations to test DB
        run: bun run db:migrate:test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/restock_test
      - name: Run integration tests
        # Override dotenv-cli's .env.test lookup — the file is gitignored, so we inject inline
        run: DATABASE_URL_TEST=postgres://postgres:postgres@localhost:5432/restock_test bun run test:integration
